[project]
name = "analisis-rocas-backend"
version = "0.1.0"
description = "Backend del sistema de análisis granulométrico de roca"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142,<0.143",
    "uvicorn[standard]>=0.54,<0.55",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.15,<3",
    "python-multipart>=0.0.32,<0.1",
    "pillow>=12.3,<13",
    "boto3>=1.35,<2",
]

[project.optional-dependencies]
# Segmentación con YOLO (en Docker se instala torch CPU antes; ver Dockerfile).
yolo = [
    "ultralytics>=8.3,<9",
]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "httpx>=0.28,<0.29",
    "ruff>=0.16,<0.17",
    "moto[s3]>=5.1,<6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
