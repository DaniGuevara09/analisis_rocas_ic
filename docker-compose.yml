services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rocas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_esta_clave}
      POSTGRES_DB: ${POSTGRES_DB:-analisis_rocas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rocas} -d ${POSTGRES_DB:-analisis_rocas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # RNF-06: el .env es opcional. Sin él, todo funciona en modo local con los valores por defecto.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rocas:cambiar_esta_clave@db:5432/analisis_rocas}
      ALMACEN_IMAGENES: ${ALMACEN_IMAGENES:-local}
      RUTA_IMAGENES: /datos/imagenes
      RUTA_MODELO: /app/modelos/best.pt
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - imagenes:/datos/imagenes
      # Espacio para el modelo entrenado: copiar best.pt en backend/modelos/ (ver su README).
      - ./backend/modelos:/app/modelos

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${PUERTO_WEB:-80}:80"

volumes:
  pgdata:
  imagenes:
